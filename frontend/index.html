<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SmartERPAI - Enterprise Manager</title>
  <script>
    // Theme flash prevention - runs synchronously before render
    // Handles: explicit dark, explicit system, or default to system preference
    (function () {
      try {
        var stored = localStorage.getItem('erp_theme');
        var isDark = false;

        if (stored === 'dark') {
          isDark = true;
        } else if (stored === 'system' || stored === null) {
          // System mode or no preference: check OS setting
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        // stored === 'light' → isDark stays false

        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { }
    })();
  </script>
  <style>
    /* Custom scrollbar with CSS variables for theme support */
    :root {
      --scrollbar-track: #f1f5f9;
      --scrollbar-thumb: #cbd5e1;
      --scrollbar-thumb-hover: #94a3b8;

      /* Default Brand Colors (Indigo) - will be overridden by JS */
      --color-brand-50: 238 242 255;
      --color-brand-100: 224 231 255;
      --color-brand-200: 199 210 254;
      --color-brand-300: 165 180 252;
      --color-brand-400: 129 140 248;
      --color-brand-500: 99 102 241;
      --color-brand-600: 79 70 229;
      --color-brand-700: 67 56 202;
      --color-brand-800: 55 48 163;
      --color-brand-900: 49 46 129;
      --color-brand-950: 30 27 75;
    }

    .dark {
      --scrollbar-track: #1e293b;
      --scrollbar-thumb: #475569;
      --scrollbar-thumb-hover: #64748b;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }

    @keyframes pulse-subtle {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(0.995);
        border-color: rgb(165 180 252);
      }
    }

    .animate-pulse-subtle {
      animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
