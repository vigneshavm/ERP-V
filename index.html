<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Enterprise Manager ERP & POS</title>
  <script>
    (function () {
      try {
        const stored = localStorage.getItem('erp_theme');
        if (stored === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-brand-50: 238 242 255;
      --color-brand-100: 224 231 255;
      --color-brand-200: 199 210 254;
      --color-brand-300: 165 180 252;
      --color-brand-400: 129 140 248;
      --color-brand-500: 99 102 241;
      --color-brand-600: 79 70 229;
      --color-brand-700: 67 56 202;
      --color-brand-800: 55 48 163;
      --color-brand-900: 49 46 129;
      --color-brand-950: 30 27 75;
    }
  </style>
  <style>
    /* Custom scrollbar with CSS variables for theme support */
    :root {
      --scrollbar-track: #f1f5f9;
      --scrollbar-thumb: #cbd5e1;
      --scrollbar-thumb-hover: #94a3b8;

      /* Default Brand Colors (Indigo) - will be overridden by JS */
      --color-brand-50: 238 242 255;
      --color-brand-100: 224 231 255;
      --color-brand-200: 199 210 254;
      --color-brand-300: 165 180 252;
      --color-brand-400: 129 140 248;
      --color-brand-500: 99 102 241;
      --color-brand-600: 79 70 229;
      --color-brand-700: 67 56 202;
      --color-brand-800: 55 48 163;
      --color-brand-900: 49 46 129;
      --color-brand-950: 30 27 75;
    }

    .dark {
      --scrollbar-track: #1e293b;
      --scrollbar-thumb: #475569;
      --scrollbar-thumb-hover: #64748b;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }

    @keyframes pulse-subtle {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(0.995);
        border-color: rgb(165 180 252);
      }
    }

    .animate-pulse-subtle {
      animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "react-redux": "https://esm.sh/react-redux@^9.2.0",
    "@reduxjs/toolkit": "https://esm.sh/@reduxjs/toolkit@^2.11.2"
  }
}
</script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
