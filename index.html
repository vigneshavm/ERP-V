<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Enterprise Manager ERP & POS</title>
     <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Override indigo to use CSS variables for dynamic runtime customization
              indigo: {
                50: 'rgb(var(--color-brand-50) / <alpha-value>)',
                100: 'rgb(var(--color-brand-100) / <alpha-value>)',
                200: 'rgb(var(--color-brand-200) / <alpha-value>)',
                300: 'rgb(var(--color-brand-300) / <alpha-value>)',
                400: 'rgb(var(--color-brand-400) / <alpha-value>)',
                500: 'rgb(var(--color-brand-500) / <alpha-value>)',
                600: 'rgb(var(--color-brand-600) / <alpha-value>)',
                700: 'rgb(var(--color-brand-700) / <alpha-value>)',
                800: 'rgb(var(--color-brand-800) / <alpha-value>)',
                900: 'rgb(var(--color-brand-900) / <alpha-value>)',
                950: 'rgb(var(--color-brand-950) / <alpha-value>)',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar with CSS variables for theme support */
      :root {
        --scrollbar-track: #f1f5f9;
        --scrollbar-thumb: #cbd5e1;
        --scrollbar-thumb-hover: #94a3b8;
        
        /* Default Brand Colors (Indigo) - will be overridden by JS */
        --color-brand-50: 238 242 255;
        --color-brand-100: 224 231 255;
        --color-brand-200: 199 210 254;
        --color-brand-300: 165 180 252;
        --color-brand-400: 129 140 248;
        --color-brand-500: 99 102 241;
        --color-brand-600: 79 70 229;
        --color-brand-700: 67 56 202;
        --color-brand-800: 55 48 163;
        --color-brand-900: 49 46 129;
        --color-brand-950: 30 27 75;
      }
      .dark {
        --scrollbar-track: #1e293b;
        --scrollbar-thumb: #475569;
        --scrollbar-thumb-hover: #64748b;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track); 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb); 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover); 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "react-redux": "https://esm.sh/react-redux@^9.2.0",
    "@reduxjs/toolkit": "https://esm.sh/@reduxjs/toolkit@^2.11.2"
  }
}
</script>
</head>
  

  <body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
